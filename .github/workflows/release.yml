name: Build and release

on:
  push:
    tags: ["v*"]          # e.g. git tag v1.0.0 && git push --tags: tests, builds and publishes a release
  pull_request:           # tests, builds and checks the release files, without publishing
  workflow_dispatch:      # manual run from the Actions tab: like a pull request

permissions:
  contents: write         # needed to create the release

env:
  VERSION: ${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}   # the tag, or "dev" for anything else

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  build:
    needs: tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows
            runner: windows-latest
          - os: macos
            runner: macos-latest   # Apple Silicon
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Stamp the version into the app
        shell: bash
        run: printf '"""Stamped by the release workflow."""\nVERSION = "%s"\n' "$VERSION" > msoverlay/version.py

      - name: Build ms-overlay.zip (Windows)
        if: matrix.os == 'windows'
        shell: powershell
        run: ./build.ps1

      - name: Build ms-overlay-mac.zip (macOS)
        if: matrix.os == 'macos'
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          ./build_mac.sh
          mv ms-overlay-mac.zip ms-overlay.zip

      - name: Name the zip after the platform and version
        shell: bash
        run: |
          name="ms-overlay-${{ matrix.os }}-$VERSION.zip"
          mv ms-overlay.zip "$name"
          echo "ZIP_NAME=$name" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v7
        with:
          path: ${{ env.ZIP_NAME }}
          archive: false        # upload the zip as it is: no zip inside GitHub's own zip (the file name names it)

  release:                # on pull requests too, so a broken release is caught before merging;
    needs: build          # only a tag publishes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ms-overlay-windows-${{ env.VERSION }}.zip
          path: dist
          skip-decompress: true   # keep the zip as it is (it would otherwise be unpacked into dist)

      - uses: actions/download-artifact@v8
        with:
          name: ms-overlay-macos-${{ env.VERSION }}.zip
          path: dist
          skip-decompress: true   # keep the zip as it is (it would otherwise be unpacked into dist)

      - name: Check both zips are there
        run: |
          ls -l dist
          test -f "dist/ms-overlay-windows-$VERSION.zip" && test -f "dist/ms-overlay-macos-$VERSION.zip"

      - name: Publish release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
