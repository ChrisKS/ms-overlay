name: Build and release

on:
  push:
    tags: ["v*"]          # e.g. git tag v1.0.0 && git push --tags
  workflow_dispatch:      # manual run from the Actions tab (builds, uploads as artifacts only)

permissions:
  contents: write         # needed to create the release

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  build:
    needs: tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows
            runner: windows-latest
          - os: macos
            runner: macos-latest   # Apple Silicon
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Stamp the version into the app
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then v="$GITHUB_REF_NAME"; else v="dev"; fi
          printf '"""Stamped by the release workflow."""\nVERSION = "%s"\n' "$v" > msoverlay/version.py
          echo "VERSION=$v" >> "$GITHUB_ENV"

      - name: Build ms-overlay.zip (Windows)
        if: matrix.os == 'windows'
        shell: powershell
        run: ./build.ps1

      - name: Build ms-overlay-mac.zip (macOS)
        if: matrix.os == 'macos'
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          ./build_mac.sh
          mv ms-overlay-mac.zip ms-overlay.zip

      - name: Name the zip after the platform and version
        shell: bash
        run: |
          name="ms-overlay-${{ matrix.os }}-$VERSION.zip"
          mv ms-overlay.zip "$name"
          echo "ZIP_NAME=$name" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v7
        with:
          path: ${{ env.ZIP_NAME }}
          archive: false        # upload the zip as it is: no zip inside GitHub's own zip (the file name names it)

  release:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ms-overlay-windows-${{ github.ref_name }}.zip
          path: dist

      - uses: actions/download-artifact@v8
        with:
          name: ms-overlay-macos-${{ github.ref_name }}.zip
          path: dist

      - name: Check both zips are there
        run: |
          ls -l dist
          test -f "dist/ms-overlay-windows-$GITHUB_REF_NAME.zip" && test -f "dist/ms-overlay-macos-$GITHUB_REF_NAME.zip"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
